<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#495057"/></marker></defs><text x="24" y="34" font-size="20" font-weight="600" fill="#1e1e1e" text-anchor="start">Business process: each step and its undo</text><text x="60" y="72" font-size="15" font-weight="600" fill="#495057" text-anchor="start">Business logic</text><text x="520" y="72" font-size="15" font-weight="600" fill="#495057" text-anchor="start">Undo (runs newest first)</text><rect x="60" y="90" width="280" height="52" rx="8" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.5"/><text x="200.0" y="121.33333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">1. Authorize payment</text><path d="M200 142 L200 168" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="170" width="280" height="52" rx="8" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.5"/><text x="200.0" y="201.33333333333334" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">2. Reserve inventory</text><path d="M200 222 L200 248" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="250" width="280" height="52" rx="8" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.5"/><text x="200.0" y="281.3333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">3. Capture payment</text><path d="M200 302 L200 328" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="330" width="280" height="52" rx="8" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.5"/><text x="200.0" y="361.3333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">4. Ship order</text><path d="M200 382 L200 408" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="410" width="280" height="52" rx="8" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.5"/><text x="200.0" y="441.3333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">5. Notify customer</text><rect x="520" y="90" width="280" height="52" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/><text x="660.0" y="121.33333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">Void authorization</text><path d="M340 116.0 L518 116.0" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="430" y="108.0" font-size="14" font-weight="400" fill="#495057" text-anchor="middle">undo</text><rect x="520" y="170" width="280" height="52" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/><text x="660.0" y="201.33333333333334" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">Release inventory</text><path d="M340 196.0 L518 196.0" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="430" y="188.0" font-size="14" font-weight="400" fill="#495057" text-anchor="middle">undo</text><rect x="520" y="250" width="280" height="52" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/><text x="660.0" y="281.3333333333333" font-size="16" font-weight="400" fill="#1e1e1e" text-anchor="middle">Refund payment</text><path d="M340 276.0 L518 276.0" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="430" y="268.0" font-size="14" font-weight="400" fill="#495057" text-anchor="middle">undo</text><rect x="520" y="410" width="280" height="52" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/><text x="660.0" y="441.3333333333333" font-size="16" font-weight="400" fill="#495057" text-anchor="middle">No undo: best effort</text><path d="M340 436.0 L518 436.0" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/><text x="24" y="520" font-size="14" font-weight="400" fill="#495057" text-anchor="start">After capture, the payment undo is a refund: the money has moved, so there is no hold left to void.</text></svg>